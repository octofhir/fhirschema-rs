[package]
name = "octofhir-fhirschema"
version = "0.3.40"
edition = "2024"
authors = ["OctoFHIR Team<funyloony@gmail.com>"]
description = "FHIR schema conversion and validation library"
license = "MIT OR Apache-2.0"
repository = "https://github.com/octofhir/fhirschema-rs"
keywords = ["fhir", "healthcare", "schema", "validation"]
include = ["src/**/*", "precompiled_schemas/**/*", "Cargo.toml", "README.md", "LICENSE*"]
categories = ["science"]

[features]
# Preserve the existing HTTP provider exports for default consumers.
default = ["http-client"]
http-client = ["octofhir-fhir-model/http-client"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
regex = { workspace = true }
chrono = { workspace = true }
async-trait = "0.1"
async-recursion = "1.0"
moka = { version = "0.12", features = ["future"] }
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }

# FHIR dependencies
octofhir-fhir-model = { version = "0.1.19", features = ["caching"] }

[dev-dependencies]
serde_json = { workspace = true }
async-trait = "0.1"
tokio = { version = "1.0", features = ["macros", "rt", "rt-multi-thread", "fs"] }
futures = "0.3"
tempfile = "3.0"
reqwest = { version = "0.13", features = ["json", "rustls"] }
proptest = "1.4"
rand = "0.10"
criterion = { version = "0.8", features = ["async_tokio"] }

[[bench]]
name = "validation_bench"
harness = false
